{{define "title"}}Login — Local MDM{{end}}
{{define "content"}}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="card w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold mb-2">Local MDM</h1>
        <p class="text-gray-600 mb-6">Sign in to manage your devices</p>
        {{if .Error}}
        <div class="mb-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm">{{.Error}}</div>
        {{end}}
        <a href="/dashboard/login" class="btn-primary w-full block">Sign in with Keycloak</a>
    </div>
</div>
{{end}}
