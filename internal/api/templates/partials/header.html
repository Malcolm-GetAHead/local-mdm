{{define "header"}}
<header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 md:px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <button id="menu-toggle" class="md:hidden p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700" aria-label="Toggle menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-xl font-semibold">{{if .PageTitle}}{{.PageTitle}}{{else}}Dashboard{{end}}</h1>
    </div>
    <div class="flex items-center gap-4">
        <button id="dark-toggle" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400" title="Toggle dark mode">
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
        </button>
        <div class="relative">
            <button id="theme-toggle" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400" title="Change theme">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
            </button>
            <div id="theme-menu" class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-1 z-50">
                <button data-theme="" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-600"></span>Default</button>
                <button data-theme="theme-ocean" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-cyan-500"></span>Ocean</button>
                <button data-theme="theme-emerald" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>Emerald</button>
                <button data-theme="theme-violet" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-violet-500"></span>Violet</button>
                <button data-theme="theme-rose" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-500"></span>Rose</button>
                <button data-theme="theme-amber" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span>Amber</button>
                <button data-theme="theme-slate" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-500"></span>Slate</button>
                <button data-theme="theme-teal" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-teal-500"></span>Teal</button>
                <button data-theme="theme-indigo" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-indigo-500"></span>Indigo</button>
                <button data-theme="theme-fuchsia" class="theme-option w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-fuchsia-500"></span>Fuchsia</button>
            </div>
        </div>
        {{if .User}}
        <span class="text-sm text-gray-600 dark:text-gray-400">{{.User.Email}}</span>
        <span class="badge badge-blue">{{.User.Role}}</span>
        <a href="/dashboard/logout" hx-boost="false" class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Logout</a>
        {{end}}
    </div>
</header>
{{end}}
