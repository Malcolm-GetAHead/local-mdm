{{define "header"}}
<header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold">{{block "page_title" .}}Dashboard{{end}}</h1>
    <div class="flex items-center gap-4">
        {{if .User}}
        <span class="text-sm text-gray-600">{{.User.Email}}</span>
        <span class="badge badge-blue">{{.User.Role}}</span>
        <a href="/dashboard/logout" class="text-sm text-gray-500 hover:text-gray-700">Logout</a>
        {{end}}
    </div>
</header>
{{end}}
