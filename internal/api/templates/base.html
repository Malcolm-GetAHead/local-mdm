<!DOCTYPE html>
<html lang="en" class="{{if .DarkMode}}dark{{end}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Local MDM{{end}}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <meta name="htmx-config" content='{"inlineStyleNonce":"{{.CSPNonce}}"}'>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/app.js" nonce="{{.CSPNonce}}" defer></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="htmx-progress"></div>
    <noscript>
        <div style="padding:2rem;text-align:center;background:#fef3c7;color:#92400e;font-family:sans-serif">
            <h2>JavaScript Required</h2>
            <p>Local MDM requires JavaScript for authentication and interactive features. Please enable JavaScript in your browser settings.</p>
        </div>
    </noscript>
    {{if .User}}
    <div class="flex min-h-screen">
        {{template "sidebar" .}}
        <main class="flex-1 md:ml-64">
            <div id="page-content" hx-boost="true" hx-target="#page-content" hx-swap="innerHTML" hx-push-url="true">
            {{template "header" .}}
            <div class="p-4 md:p-8">
                {{block "content" .}}{{end}}
            </div>
            </div>
        </main>
    </div>
    {{else}}
    <main>
        {{block "content" .}}{{end}}
    </main>
    {{end}}
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
</body>
</html>
