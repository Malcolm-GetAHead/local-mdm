services:
  postgres:
    image: postgres:15-alpine
    container_name: localmdm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-password-1234
      POSTGRES_DB: localmdm
      POSTGRES_MULTIPLE_DATABASES: localmdm,keycloak,nanomdm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/01-init-multiple-databases.sh
      - ./docker/postgres/init-nanomdm-schema.sh:/docker-entrypoint-initdb.d/02-init-nanomdm-schema.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: localmdm-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres-dev-password-1234
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/8180"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  nanomdm:
    build:
      context: ./docker/nanomdm
      dockerfile: Dockerfile
    image: localmdm-nanomdm:v0.9.0
    container_name: localmdm-nanomdm
    ports:
      - "9000:9000"
    environment:
      NANOMDM_STORAGE: pgsql
      NANOMDM_STORAGE_DSN: "postgres://postgres:postgres-dev-password-1234@postgres:5432/nanomdm?sslmode=disable"
      NANOMDM_API: "localmdm-nanomdm-api-key"
      NANOMDM_WEBHOOK_URL: "http://localmdm:8080/api/v1/macos/webhook"
      NANOMDM_CHECKIN: "1"
      NANOMDM_DEBUG: "1"
      NANOMDM_CA: "/certs/ca.crt"
      NANOMDM_RETRO: "1"
    volumes:
      - ./internal/api/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy

  # === Local MDM server (production-like build) ===
  localmdm:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: localmdm-server
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      CONFIG_PATH: /app/configs/config.docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./internal/api/certs:/app/certs
      - ./secrets:/app/secrets:ro

  # === Dev mode: hot reload with source mounted ===
  localmdm-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: localmdm-dev
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      CONFIG_PATH: /src/configs/config.docker.yaml
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  # === Test runner: runs go test inside container ===
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: localmdm-test-runner
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres-dev-password-1234
      DB_NAME: localmdm
      NANOMDM_URL: "http://nanomdm:9000"
      KEYCLOAK_URL: "http://keycloak:8180"
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    profiles:
      - test
    command: ["go", "test", "-race", "-p", "4", "-count=1", "./..."]

  nginx-tls:
    image: nginx:alpine
    container_name: localmdm-nginx
    ports:
      - "443:443"
      - "8443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./internal/api/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./internal/api/certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      localmdm:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: localmdm-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
