version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: localmdm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localmdm
      POSTGRES_MULTIPLE_DATABASES: localmdm,keycloak,nanomdm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/01-init-multiple-databases.sh
      - ./docker/postgres/init-nanomdm-schema.sh:/docker-entrypoint-initdb.d/02-init-nanomdm-schema.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: localmdm-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: localmdm-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  nanomdm:
    build:
      context: ./docker/nanomdm
      dockerfile: Dockerfile
    image: localmdm-nanomdm:v0.9.0
    container_name: localmdm-nanomdm
    ports:
      - "9000:9000"
    environment:
      NANOMDM_STORAGE: pgsql
      NANOMDM_STORAGE_DSN: "postgres://postgres:postgres@postgres:5432/nanomdm?sslmode=disable"
      NANOMDM_API: "localmdm-nanomdm-api-key"
      NANOMDM_WEBHOOK_URL: "http://host.docker.internal:8080/api/v1/macos/webhook"
      NANOMDM_CHECKIN: "1"
      NANOMDM_DEBUG: "1"
      NANOMDM_CA: "/certs/ca.crt"
      NANOMDM_RETRO: "1"
    volumes:
      - ./internal/api/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
