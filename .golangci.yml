# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Enabled by default
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - unused        # Check for unused code
    
    # Additional linters
    - gocyclo       # Cyclomatic complexity
    - gofmt         # Format code
    - goimports     # Manage imports
    - misspell      # Spell check
    - gocritic      # Comprehensive checks
    - revive        # Fast, configurable linter
    - gosec         # Security checks
    - bodyclose     # Check HTTP response body closed
    - noctx         # Check for missing context
    - sqlclosecheck # Check SQL rows/statements closed
    - rowserrcheck  # Check SQL rows.Err()
    - errorlint     # Error wrapping checks
    - exportloopref # Check loop variable capture
    - goconst       # Find repeated strings that could be constants
    - unconvert     # Remove unnecessary type conversions

linters-settings:
  gocyclo:
    min-complexity: 15  # Maximum cyclomatic complexity
  
  gocritic:
    enabled-tags:
      - diagnostic    # Diagnostics
      - performance   # Performance improvements
      - style         # Code style
    disabled-checks:
      - ifElseChain   # Allow if-else chains
  
  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
  
  gosec:
    excludes:
      - G104  # Audit errors not checked (we use errcheck)
      - G304  # File path from variable (needed for config files)
  
  errorlint:
    errorf: true        # Check %w in fmt.Errorf
    asserts: true       # Check error assertions
    comparison: true    # Check error comparisons

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - goconst
    
    # Exclude magic number checks for tests
    - path: _test\.go
      text: "mnd: Magic number"
    
    # Exclude certain checks for generated code
    - path: ".*\\.pb\\.go"
      linters:
        - all
  
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
