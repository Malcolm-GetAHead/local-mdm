# Local MDM Configuration

# Environment: development, staging, or production
# CRITICAL: TLS is required for staging and production
environment: "development"

server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  request_timeout: 30s  # Maximum time for request processing
  rate_limit:
    enabled: true
    requests_per_min: 100
    window: 1m
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Content-Type"
      - "Authorization"
    allow_credentials: true
    max_age: 3600

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "localmdm"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  query_timeout: 30s

auth:
  jwt_secret: "REPLACE_WITH_ENV_VAR"  # CRITICAL: Set JWT_SECRET environment variable (min 32 chars)
  access_token_duration: 1h
  refresh_token_duration: 168h  # 7 days
  circuit_breaker:
    max_failures: 5      # Number of failures before circuit opens
    timeout: 30s         # Time to wait before attempting recovery
  token_cache:
    ttl: 5m              # Token cache time-to-live
  audit_log:
    buffer_size: 1000    # Async audit log queue size
    worker_count: 3      # Number of background workers

keycloak:
  url: "http://localhost:8180"
  realm: "localmdm"
  client_id: "localmdm-api"
  client_secret: "REPLACE_WITH_ENV_VAR"  # CRITICAL: Set KEYCLOAK_CLIENT_SECRET environment variable

certificates:
  ca_cert_path: "./certs/ca.crt"
  ca_key_path: "./certs/ca.key"
  device_cert_validity: 8760h  # 1 year
  expiration_monitor:
    enabled: true
    check_interval: 24h        # How often to check for expiring certificates
    warning_threshold: 720h    # Warn when certificates expire within 30 days

windows:
  discovery_url: "https://localhost:8080/windows/discovery"
  enrollment_url: "https://localhost:8080/windows/enrollment"
  management_url: "https://localhost:8080/windows/management"

macos:
  apns_cert_path: "./certs/apns.p12"
  apns_password: ""
  push_topic: "com.example.mdm"
  enrollment_url: "https://localhost:8080/macos/enroll"

android:
  project_id: ""
  service_account_json: "./configs/android-service-account.json"
  webhook_url: "https://localhost:8080/android/webhook"

logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  output: "stdout"  # stdout, file
  file_path: "./logs/app.log"

tracing:
  enabled: false  # Enable distributed tracing (stdout exporter)
  service: "local-mdm"
  version: "0.1.0"

admin:
  allowed_ips: []  # IP allowlist for admin operations (empty = allow all)
  # Examples:
  # - "192.168.1.0/24"      # Local network
  # - "10.0.0.0/8"          # Corporate network
  # - "203.0.113.5"         # Single IP (auto-converts to /32)

features:
  enable_audit_log: true
  enable_webhooks: false
  enable_metrics: false
