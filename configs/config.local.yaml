# Local host config — for running the server directly on the host machine
# while Docker services (postgres, keycloak, nanomdm) are running.
# Usage: CONFIG_PATH=configs/config.local.yaml go run ./cmd/server/
#
# For normal development, use: make dev (runs everything in Docker)

environment: development

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  request_timeout: 30s
  health_check_timeout: 5s
  rate_limit:
    enabled: true
    requests_per_min: 100
    window: 1m

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres-dev-password-1234"
  database: "localmdm"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  query_timeout: 30s

auth:
  jwt_secret: "localmdm-docker-dev-jwt-secret-32chars!"
  access_token_duration: 15m
  refresh_token_duration: 24h
  circuit_breaker:
    max_failures: 5
    timeout: 30s
  token_cache:
    ttl: 5m
  audit_log:
    buffer_size: 1000
    worker_count: 2

keycloak:
  url: "http://localhost:8180"
  realm: "localmdm"
  client_id: "localmdm-api"
  client_secret: "localmdm-docker-dev-keycloak-secret"

certificates:
  ca_cert_path: "./internal/api/certs/ca.crt"
  ca_key_path: "./internal/api/certs/ca.key"
  device_cert_validity: 8760h
  scep_challenge_ttl: 5m

macos:
  push_topic: "com.example.mdm"
  nanomdm_url: "http://localhost:9000"
  nanomdm_api_key: "localmdm-nanomdm-api-key"

android:
  webhook_secret: ""

logging:
  level: "debug"
  format: "json"

features:
  enable_audit_log: true
  enable_webhooks: true

metrics:
  enabled: true
  host: "127.0.0.1"
  port: 9090
