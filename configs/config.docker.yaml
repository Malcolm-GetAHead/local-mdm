# Docker environment config — uses container service names for networking
environment: development

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  request_timeout: 30s
  health_check_timeout: 5s
  rate_limit:
    enabled: true
    requests_per_min: 100
    window: 1m

database:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "postgres-dev-password-1234"
  database: "localmdm"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  query_timeout: 30s

auth:
  jwt_secret: "localmdm-docker-dev-jwt-secret-32chars!"
  access_token_duration: 15m
  refresh_token_duration: 24h
  circuit_breaker:
    max_failures: 5
    timeout: 30s
  token_cache:
    ttl: 5m
  audit_log:
    buffer_size: 1000
    worker_count: 2

keycloak:
  url: "http://keycloak:8180"
  realm: "localmdm"
  client_id: "localmdm-api"
  client_secret: "localmdm-dev-dashboard-secret-2026"
  session_secret: "" # Optional: dedicated HMAC key for sessions. Falls back to client_secret.

certificates:
  ca_cert_path: "/app/certs/ca.crt"
  ca_key_path: "/app/certs/ca.key"
  device_cert_validity: 8760h
  scep_challenge_ttl: 5m

windows:
  discovery_url: ""
  enrollment_url: ""
  management_url: ""

macos:
  apns_cert_path: ""
  apns_password: ""
  push_topic: "com.example.mdm"
  enrollment_url: "https://localmdm:8080/macos/enroll"
  nanomdm_url: "http://nanomdm:9000"
  nanomdm_api_key: "localmdm-nanomdm-api-key"
  default_enterprise_id: "00000000-0000-0000-0000-000000000001"

android:
  project_id: ""
  service_account_json: ""
  webhook_url: "http://localmdm:8080/android/webhook"
  webhook_secret: ""

logging:
  level: "debug"
  format: "json"

features:
  enable_audit_log: true
  enable_webhooks: true

metrics:
  enabled: true
  host: "0.0.0.0"
  port: 9090

tracing:
  enabled: false
  service: "localmdm"
  version: "1.0.0"
